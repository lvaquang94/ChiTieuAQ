<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f6f7f4;--card:#fff;--tx:#1d2420;--mu:#6b756e;--bd:#e3e7e1;--in:#1f9d63;--out:#d9503f;--ac:#1d2420;--ac-t:#fff;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141815;--card:#1e241f;--tx:#eef2ee;--mu:#98a39b;--bd:#2f3832;--in:#4cc88c;--out:#ff7d6b;--ac:#eef2ee;--ac-t:#141815;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141815;--card:#1e241f;--tx:#eef2ee;--mu:#98a39b;--bd:#2f3832;--in:#4cc88c;--out:#ff7d6b;--ac:#eef2ee;--ac-t:#141815;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px 14px 90px;max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0}
#hd{display:flex;justify-content:space-between;align-items:center;margin:4px 0 14px;gap:8px}
#hd small{color:var(--mu);text-align:right}#hd a{color:var(--out);cursor:pointer;text-decoration:underline}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.seg{display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--mu);padding:9px;border-radius:8px;font:600 15px inherit;font-family:inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--ac-t)}
.seg.in button.on{background:var(--in);color:#fff}.seg.out button.on{background:var(--out);color:#fff}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
input.big{font-size:24px;font-weight:700}
.dt{position:relative;display:flex;justify-content:space-between;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.dt input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;padding:0}
.two{display:flex;gap:8px;margin-bottom:12px}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:var(--ac);color:var(--ac-t);font:700 16px inherit;font-family:inherit;cursor:pointer}
.sm{border:0;border-radius:8px;padding:8px 12px;background:var(--ac);color:var(--ac-t);font:600 14px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.sm.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px}
.sum small{color:var(--mu);font-size:12px;display:block}.sum strong{font-size:16px}.sum .full{grid-column:1/-1}
.in{color:var(--in)}.out{color:var(--out)}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--mu);margin:14px 2px 6px}
.row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}.row .n{flex:1;min-width:0;overflow-wrap:anywhere}.row small{color:var(--mu)}
.bar{height:6px;background:var(--bd);border-radius:9px;margin-top:5px;overflow:hidden}.bar i{display:block;height:100%}
.it{padding:8px 0}.it .t{display:flex;justify-content:space-between;gap:8px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mu);font-weight:600}
h3{font-size:15px;margin:0 0 6px}.empty{color:var(--mu);text-align:center;padding:18px 0;font-size:14px}
.err{color:var(--out);font-size:14px;margin-top:10px}.hint{color:var(--mu);font-size:12px;margin-top:10px}
.cb{position:relative}.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}.md{background:var(--card);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin-top:6px}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dd{display:none;position:absolute;left:0;right:0;top:100%;margin-top:4px;max-height:230px;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:6}.di{padding:12px;cursor:pointer;border-bottom:1px solid var(--bd);overflow-wrap:anywhere}.di:last-child{border:0}.di:hover{background:var(--bg)}
.cap{display:flex;gap:8px;align-items:center}.cap canvas{border-radius:8px;border:1px solid var(--bd);flex:none}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:6px 2px;font:600 12px inherit;font-family:inherit;cursor:pointer}nav button.on{color:var(--tx)}nav span{display:block;font-size:19px}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ac);color:var(--ac-t);padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:9}#toast.on{opacity:1}
.sc{padding:0;overflow:hidden}.sh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 14px;cursor:pointer;user-select:none}.sh h3{margin:0}.sh small{color:var(--mu);font-size:12px;margin-right:8px}.sb{padding:0 14px 14px}.sb[hidden]{display:none}.ch{display:inline-block;font-style:normal;color:var(--mu);transition:transform .2s}.ch.o{transform:rotate(180deg)}
.card{border-radius:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sum strong{font-size:18px;font-variant-numeric:tabular-nums}.sum div{border-radius:14px}.sum div:first-child{border-left:3px solid var(--in)}.sum div:nth-child(2){border-left:3px solid var(--out)}
.btn,.sm,input,select{transition:.15s}.btn:active,.sm:active{transform:scale(.97)}input:focus,select:focus{outline:2px solid var(--ac);outline-offset:-1px}
nav{backdrop-filter:blur(10px);box-shadow:0 -2px 12px rgba(0,0,0,.06)}nav button.on{font-weight:700}nav button.on span{transform:scale(1.15)}nav span{transition:transform .15s}
.row{padding:11px 0}.row b{font-variant-numeric:tabular-nums;white-space:nowrap}.row .sm{padding:6px 9px;font-size:13px}#hd h1{font-weight:800;letter-spacing:-.3px}
.sw{display:flex;gap:12px;flex-wrap:wrap}.sw button{width:38px;height:38px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--bd);cursor:pointer}.sw button.on{box-shadow:0 0 0 3px var(--tx)}.ic{border:1px solid var(--bd);background:var(--card);width:36px;height:36px;border-radius:50%;font-size:17px;cursor:pointer;padding:0}
#ft{text-align:center;color:var(--mu);font-size:12px;margin:22px 0 4px;line-height:1.7}#ft b{color:var(--tx);font-weight:600}
nav{flex-direction:column;padding-bottom:calc(4px + env(safe-area-inset-bottom,0px))}.nt{display:flex;width:100%}.nv{text-align:center;font-size:10.5px;color:var(--mu);padding:2px 0 0;line-height:1.4}.nv b{color:var(--tx);font-weight:600}body{padding-bottom:112px}#toast{bottom:112px}
.utg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.ut{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:left;color:var(--tx);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;box-shadow:0 1px 3px rgba(0,0,0,.05)}.ut span{font-size:26px}.ut small{color:var(--mu);font-size:12px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chp{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:99px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}.calc{display:flex;gap:6px;margin-top:8px}.calc button{flex:1;padding:9px 0;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font:600 15px inherit;font-family:inherit;cursor:pointer}.emo{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.emo button{width:38px;height:38px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-size:19px;cursor:pointer;padding:0}.emo button.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--tx)}nav button{font-size:11px;padding:6px 1px}
.lg-pill{border:1px solid var(--bd);background:var(--card);border-radius:99px;padding:7px 11px;font:600 11px inherit;font-family:inherit;color:var(--mu);cursor:pointer;white-space:nowrap}.lg-pill span.on{color:var(--tx);font-weight:800}
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;transition:opacity .5s;color:var(--tx)}
.sp-coin{font-size:88px;animation:bob 1.6s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-12px) rotate(8deg)}}
.sp-q{font-size:19px;line-height:1.55;font-style:italic;max-width:420px;margin:0 0 8px}.sp-a{color:var(--mu);margin:0;font-size:14px}
.sp-bar{width:60%;max-width:260px;height:4px;background:var(--bd);border-radius:9px;overflow:hidden;margin-top:28px}.sp-bar i{display:block;height:100%;background:var(--in);width:0;animation:spf 5s linear forwards}@keyframes spf{to{width:100%}}
.g48{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:var(--bd);padding:8px;border-radius:12px;touch-action:none;user-select:none;max-width:380px;margin:0 auto}.t48{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--bg)}
.crb{display:grid;grid-template-columns:repeat(12,1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:8px;overflow:hidden;max-width:440px;margin:0 auto}.crc{aspect-ratio:1;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:clamp(12px,3.6vw,20px);font-weight:800;cursor:pointer}.crc.l{background:rgba(245,166,35,.28)}
.mmg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:380px;margin:0 auto}.mmc{aspect-ratio:1;border-radius:12px;border:1px solid var(--bd);background:var(--ac);color:var(--ac-t);font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none}.mmc.o{background:var(--card);color:inherit}.mmc.d{background:var(--card);color:inherit;opacity:.45}
.pad{display:grid;grid-template-columns:repeat(3,58px);gap:8px;justify-content:center;margin-top:12px}.pad button{height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:20px;color:var(--tx);cursor:pointer}
#toast{z-index:30}
</style>

<body>
<div id="hd"></div>
<div id="app"></div>
<footer id="ft"></footer>
<nav id="nav"></nav>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=iso(new Date());
const fmt=n=>Math.round(n).toLocaleString('vi-VN')+' đ';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dmy=d=>d.split('-').reverse().join('/');
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())};
const lget=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lset=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};

/* ---------- tài khoản ---------- */
let users={};try{users=JSON.parse(lget('qlct_users')||'{}')}catch(e){}
let U=lget('qlct_session');if(U&&!users[U])U=null;
let S={tx:[],notes:{in:[],out:[]}};
function loadData(){S={tx:[],notes:{in:[],out:[]}};try{const r=lget('qlct_d_'+U);if(r)S=JSON.parse(r)}catch(e){}S.loans=S.loans||[];S.qrs=S.qrs||[];S.mc=S.mc||[];S.trash=(S.trash||[]).filter(t=>Date.now()-t.del<2592e6)}
const save=()=>{lset('qlct_d_'+U,JSON.stringify(S));gDirty()};
if(U)loadData();
async function hash(p,salt){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){return btoa(unescape(encodeURIComponent(salt+p)))}
}
let A={mode:'login',err:'',phone:''},capCode='';
function newCap(){
  const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';capCode='';
  for(let i=0;i<5;i++)capCode+=ch[Math.floor(Math.random()*ch.length)];
  const c=$('#cv');if(!c)return;const x=c.getContext('2d');
  x.fillStyle='#eef1ec';x.fillRect(0,0,140,46);
  for(let i=0;i<7;i++){x.strokeStyle='hsl('+Math.random()*360+',40%,60%)';x.beginPath();x.moveTo(Math.random()*140,Math.random()*46);x.lineTo(Math.random()*140,Math.random()*46);x.stroke()}
  x.font='bold 28px monospace';x.textBaseline='middle';
  for(let i=0;i<5;i++){x.save();x.translate(14+i*25,24+Math.random()*6-3);x.rotate(Math.random()*.6-.3);x.fillStyle='hsl('+Math.random()*360+',55%,28%)';x.fillText(capCode[i],0,0);x.restore()}
}
let AREM={};
const chipHtml=(loc)=>{const seen=new Set(),all=[];[...loc,...Object.values(AREM).map(x=>x.name)].forEach(n=>{const k=slugOf(n);if(!seen.has(k)){seen.add(k);all.push(n)}});return all.length?`<div class="chips">${all.map(n=>`<button type="button" class="chp" data-u="${esc(n)}">${hasPin(n)?'🔒':'👤'} ${esc(n)}</button>`).join('')}</div>`:'<div class="empty" style="padding:8px 0">Chưa có người dùng nào</div>'};
function bindChips(){document.querySelectorAll('.chp[data-u]').forEach(c=>c.onclick=()=>pickUser(c.dataset.u))}
function authView(){
  if(A.cfg){authCfg();return}
  $('#hd').innerHTML='<h1>💰 Quản lý chi tiêu</h1>'+langBtn();$('#nav').style.display='none';$('#ft').style.display='';
  const c=ghCfg();
  $('#app').innerHTML=`<form class="card" onsubmit="return doAuth(event)">
  <h3 style="font-size:18px;margin:0 0 4px">👋 Chào mừng!</h3><div class="hint" style="margin:0 0 6px">Nhập một tên người dùng mới để bắt đầu. Mỗi tên chỉ được dùng một lần, không trùng với người dùng đã có.</div>
  <label>Tên người dùng mới</label><input id="un" maxlength="30" placeholder="VD: Quang" value="${esc(A.phone)}" autocomplete="username" autocapitalize="words">
  ${A.err?`<div class="err">${esc(A.err)}</div>`:''}
  <button class="btn" type="submit" id="unb">Tạo và vào ứng dụng</button></form>
  <div class="card"><h3>Người dùng đã có</h3><div id="uchips">${chipHtml(Object.keys(users))}</div>
  <div class="hint">${c?'Đã kết nối GitHub: '+esc(c.repo):'Quản trị viên: <a onclick="A.cfg=true;render()" style="color:var(--out);text-decoration:underline;cursor:pointer">kết nối GitHub</a>'}</div></div>`;
  bindChips();
  if(c)ghUsers().then(u=>{AREM=u;const e=$('#uchips');if(e){e.innerHTML=chipHtml(Object.keys(users));bindChips()}}).catch(()=>{});
}
function authCfg(){
  $('#hd').innerHTML='<h1>💰 Quản lý chi tiêu</h1>'+langBtn();$('#nav').style.display='none';$('#ft').style.display='';
  $('#app').innerHTML=`<div class="row" style="border:0;padding:0 0 10px"><button class="sm g" onclick="A.cfg=false;render()">‹ Quay lại</button><h3 style="margin:0;flex:1">🐙 Kết nối GitHub</h3></div><div class="card">${ghForm()}</div>`;
}
const SAME='Tên người dùng không hợp lệ: đã có người dùng này. Hãy chọn tên khác, hoặc chọn người dùng đó ở danh sách bên dưới.';
async function doAuth(e){
  e.preventDefault();
  const name=$('#un').value.trim().replace(/\s+/g,' ');A.phone=name;
  if(!name){A.err='Hãy nhập tên người dùng';render();return false}
  const sl=slugOf(name);
  if(Object.keys(users).some(k=>slugOf(k)===sl)){A.err=SAME;render();return false}
  const b=$('#unb');if(b)b.disabled=true;
  if(ghCfg()){
    try{if(await ghClaim(name)==='exists'){A.err=SAME;render();return false}}
    catch(err){A.err='Không kiểm tra được tên trên GitHub: '+ghErr(String(err.message||err));render();return false}
  }
  A.phone='';await pickUser(name,true);return false;
}
async function pickUser(name,fresh){
  const sec=secOf(name);
  if(!fresh&&sec&&sec.ph){PN={mode:'ask',name,err:''};drawPin();return}
  await enterUser(name,sec);
}
async function enterUser(name,sec){
  const first=!Object.keys(users).length;
  if(!users[name]){users[name]={created:Date.now()};if(first){const old=lget('qlct_v1');if(old)lset('qlct_d_'+name,old)}}
  if(sec&&sec.ph)Object.assign(users[name],{ps:sec.ps,ph:sec.ph,pp:sec.pp,pm:sec.pm,rh:sec.rh,pt:sec.pt});
  lset('qlct_users',JSON.stringify(users));
  U=name;lset('qlct_session',U);loadData();gInit();A={mode:'login',err:'',phone:''};V.tab='nhap';render();
}
function logout(){U=null;try{localStorage.removeItem('qlct_session')}catch(e){}render()}

/* ---------- ứng dụng ---------- */
let V={tab:'nhap',type:'out',date:today,hm:today.slice(0,7),sp:'month',sm:today.slice(0,7),sy:today.slice(0,4),nt:'out',edit:null,src:'cash',ut:null,ei:'',ec:'',en:''};
let draft={amount:'',note:''},D={in:{amount:'',note:''},out:{amount:'',note:''}},armed=null;
let tt;function toast(m,act,lb){const t=$('#toast');t.textContent=m;t.style.pointerEvents='none';if(act){const b=document.createElement('button');b.textContent=lb||'Hoàn tác';b.style.cssText='margin-left:12px;border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;cursor:pointer';b.onclick=()=>{act();t.classList.remove('on')};t.appendChild(b);t.style.pointerEvents='auto'}t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),act?6000:1600)}
let OPEN={};try{OPEN=JSON.parse(lget('qlct_open')||'{}')}catch(e){}
const sv=()=>lset('qlct_open',JSON.stringify(OPEN));let RN=30;
function secO(id,title,def,badge=''){const o=id in OPEN?OPEN[id]:def;return `<div class="card sc"><div class="sh" onclick="tg('${id}',${def})"><h3>${title}</h3><span>${badge?`<small>${badge}</small>`:''}<i class="ch ${o?'o':''}">▾</i></span></div><div class="sb" ${o?'':'hidden'}>`}
const secC=()=>'</div></div>';
function tg(id,def){OPEN[id]=!(id in OPEN?OPEN[id]:def);sv();render()}
/* ---------- giao diện ---------- */
let TH={mode:'auto',color:'',size:1},dupOK='';try{Object.assign(TH,JSON.parse(lget('qlct_theme')||'{}'))}catch(e){}
const COLORS=['','#2f7de1','#1f9d63','#8b5cf6','#f08a24','#e5568a'];
function applyTheme(){const r=document.documentElement;
  if(TH.mode==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',TH.mode);
  if(TH.color){r.style.setProperty('--ac',TH.color);r.style.setProperty('--ac-t','#fff')}else{r.style.removeProperty('--ac');r.style.removeProperty('--ac-t')}
  ['#app','#hd'].forEach(s=>{const e=$(s);if(e)e.style.zoom=TH.size})}
function setTh(k,v){TH[k]=v;lset('qlct_theme',JSON.stringify(TH));applyTheme();drawTheme()}
function closeTheme(){const o=$('#ovt');if(o)o.remove()}
function openTheme(){drawTheme()}
function drawTheme(){

function trashHtml(){
  if(!S.trash.length)return '<div class="empty">Thùng rác trống. Giao dịch bị xóa được giữ 30 ngày.</div>';
  return S.trash.slice().reverse().map(t=>`<div class="row"><div class="n">${esc(t.note)}<br><small>${dmy(t.date)} · xóa ${dmy(iso(new Date(t.del)))}</small></div><b class="${t.type}">${t.type==='in'?'+':'−'}${fmt(t.amount)}</b><button class="sm g" onclick="restoreTx('${t.id}')">Khôi phục</button><button class="sm g ${armed==='x'+t.id?'out':''}" onclick="ask('x${t.id}',()=>purge('${t.id}'))">${armed==='x'+t.id?'Chắc chắn?':'Xóa hẳn'}</button></div>`).join('')+`<button class="sm g" style="width:100%;margin-top:8px" onclick="ask('xall',()=>{S.trash=[];save();render()})">${armed==='xall'?'Chắc chắn?':'Dọn sạch thùng rác'}</button>`;
}
function purge(id){S.trash=S.trash.filter(t=>String(t.id)!==id);save();render()}
function restoreTx(id){const t=S.trash.find(x=>String(x.id)===id);if(!t)return;S.trash=S.trash.filter(x=>x!==t);const r={...t};delete r.del;S.tx.push(r);save();render();toast('Đã khôi phục ✓')}

let LD={dir:'lend',who:'',amount:'',date:today,due:'',note:'',eid:null},LF='open',LP=null,LK='lend';
const paidOf=l=>(l.paid||[]).reduce((s,p)=>s+p.amt,0),remOf=l=>Math.max(0,l.amount-paidOf(l));

  <label>Số tiền (đ)</label><input id="la" inputmode="numeric" placeholder="0" value="${esc(LD.amount)}">
  <div class="g2"><div><label>Ngày</label>${dpick('ld',LD.date)}</div><div><label>Hạn trả (tùy chọn)</label>${dpick('lu',LD.due)}</div></div>

  ${secO('v_pay',ln?'Lịch sử thu nợ':'Lịch sử trả nợ',false,pays.length+' mục')}${pays.length?pays.map(p=>{const k='p'+p.lid+'_'+p.i;return `<div class="row"><div class="n"><b>${esc(p.who)}</b><br><small>${dmy(p.date)}</small></div><b class="${c}">${fmt(p.amt)}</b><button class="sm g ${armed===k?'out':''}" onclick="ask('${k}',()=>delPay('${p.lid}',${p.i}))">${armed===k?'Chắc chắn?':'Xóa'}</button></div>`}).join(''):'<div class="empty">Chưa có lần trả nào</div>'}${secC()}

function loanCard(l){
  const r=remOf(l),p=paidOf(l),pc=l.amount?p/l.amount*100:0,od=r>0&&l.due&&l.due<today,k='l'+l.id,c=l.dir==='lend'?'in':'out';

  <div class="bar"><i style="width:${pc}%;background:var(--${c})"></i></div>
  <small style="color:var(--mu)">Đã trả ${fmt(p)} / ${fmt(l.amount)}${od?' · <b class="out">quá hạn</b>':''}</small>
  <div style="display:flex;gap:8px;margin-top:10px">${r>0?`<button class="sm" onclick="openPay('${l.id}')">${l.dir==='lend'?'Họ trả':'Tôi trả'}</button>`:''}<button class="sm g" onclick="editLoan('${l.id}')">Sửa</button><button class="sm g ${armed===k?'out':''}" onclick="ask('${k}',()=>delLoan('${l.id}'))">${armed===k?'Chắc chắn?':'Xóa'}</button></div></div>`;
}
function syncL(){const w=$('#lw');if(!w)return;LD.who=w.value;LD.amount=$('#la').value;LD.note=$('#ln').value}
function bindVm(){

  bindDp('ld',v=>{syncL();LD.date=v||LD.date;render()});bindDp('lu',v=>{syncL();LD.due=v;render()});

function addLoan(){
  syncL();const amt=Number(String(LD.amount).replace(/\D/g,''));
  if(!LD.who.trim()){toast('Hãy nhập tên người');return}
  if(!amt){toast('Hãy nhập số tiền');return}
  if(LD.eid){const l=S.loans.find(x=>x.id===LD.eid);if(!l){cancelLoan();return}
    if(amt<paidOf(l)){toast('Số tiền nhỏ hơn số đã trả');return}
    Object.assign(l,{who:LD.who.trim(),amount:amt,date:LD.date,due:LD.due,note:LD.note.trim()});
  }else S.loans.push({id:Date.now()+Math.random(),dir:LK,who:LD.who.trim(),amount:amt,date:LD.date,due:LD.due,note:LD.note.trim(),paid:[]});
  save();LD={dir:LK,who:'',amount:'',date:today,due:'',note:'',eid:null};render();toast('Đã lưu ✓');
}
function setLK(k){syncL();LK=k;LD={dir:k,who:'',amount:'',date:today,due:'',note:'',eid:null};render()}
function editLoan(id){const l=S.loans.find(x=>String(x.id)===id);if(!l)return;LK=l.dir;LD={dir:l.dir,who:l.who,amount:l.amount.toLocaleString('vi-VN'),date:l.date,due:l.due||'',note:l.note||'',eid:l.id};OPEN.v_add=true;sv();render();window.scrollTo(0,0)}
function cancelLoan(){LD={dir:LK,who:'',amount:'',date:today,due:'',note:'',eid:null};render()}
function delPay(id,i){const l=S.loans.find(x=>String(x.id)===id);if(!l||!l.paid)return;const p=l.paid.splice(i,1)[0];save();render();toast('Đã xóa lần trả',()=>{l.paid.splice(i,0,p);save();render()})}
function delLoan(id){const l=S.loans.find(x=>String(x.id)===id);if(!l)return;S.loans=S.loans.filter(x=>x!==l);save();render();toast('Đã xóa khoản vay/mượn',()=>{S.loans.push(l);save();render()})}
function openPay(id){const l=S.loans.find(x=>String(x.id)===id);if(!l)return;LP={id:l.id,amt:remOf(l),max:remOf(l),date:today,who:l.who,dir:l.dir};drawPay()}
function drawPay(){
  let o=$('#ovp');if(!o){o=document.createElement('div');o.id='ovp';o.className='ov';document.body.appendChild(o)}
  o.innerHTML=`<div class="md"><h3>${LP.dir==='lend'?esc(LP.who)+' trả bạn':'Bạn trả '+esc(LP.who)}</h3><label>Số tiền (đ) — còn lại ${fmt(LP.max)}</label><input id="pa" inputmode="numeric" value="${LP.amt.toLocaleString('vi-VN')}"><label>Ngày</label>${dpick('pd',LP.date)}<div class="g2"><button class="btn" style="background:var(--bg);color:var(--tx);border:1px solid var(--bd)" onclick="closePay()">Hủy</button><button class="btn" onclick="savePay()">Lưu</button></div></div>`;
  const a=$('#pa');a.oninput=()=>{const d=a.value.replace(/\D/g,'');a.value=d?Number(d).toLocaleString('vi-VN'):'';LP.amt=Number(d)||0};
  bindDp('pd',v=>{LP.date=v||LP.date;drawPay()});
}
function savePay(){
  const l=S.loans.find(x=>x.id===LP.id),a=Number(($('#pa').value||'').replace(/\D/g,''));
  if(!l||!a){toast('Hãy nhập số tiền');return}
  if(a>LP.max){toast('Vượt quá số còn lại');return}
  (l.paid=l.paid||[]).push({amt:a,date:LP.date});save();closePay();render();toast('Đã ghi nhận ✓');
}
function closePay(){const o=$('#ovp');if(o)o.remove();LP=null}

/* ---------- máy tính trong ô số tiền ---------- */
function calcAmt(str){
  let s=String(str).toLowerCase().replace(/[×x]/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s+/g,'');
  s=s.replace(/(\d)\.(?=\d{3}(?!\d))/g,'$1').replace(/,/g,'.');
  s=s.replace(/(\d+(?:\.\d+)?)(?:tỷ|ty)/g,'($1*1e9)')
   .replace(/(\d+)(?:triệu|trieu|tr|m)(\d+)/g,'($1.$2*1e6)')
   .replace(/(\d+(?:\.\d+)?)(?:triệu|trieu|tr|m)/g,'($1*1e6)')
   .replace(/(\d+)(?:nghìn|nghin|ngàn|ngan|k)(\d+)/g,'($1.$2*1e3)')
   .replace(/(\d+(?:\.\d+)?)(?:nghìn|nghin|ngàn|ngan|k)/g,'($1*1e3)');
  if(!s||/[^\d+\-*/().e]/.test(s))return NaN;
  try{const r=Function('"use strict";return ('+s+')')();return isFinite(r)?Math.round(r):NaN}catch(e){return NaN}
}
const amtOf=v=>/^[\d.\s]*$/.test(v)?Number(v.replace(/\D/g,'')):calcAmt(v);

const noAcc=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^\x20-\x7E]/g,'');

function mHint(){

function bindMc(){

function addMc(){
  syncM();const amt=Number(String(M.amount).replace(/\D/g,''));
  if(!M.who.trim()){toast('Hãy nhập tên người');return}
  if(!amt){toast('Hãy nhập số tiền');return}
  const rec={id:M.eid||Date.now()+Math.random(),dir:M.dir,who:M.who.trim(),amount:amt,event:M.event.trim(),date:M.date,note:M.note.trim()};
  if(M.eid){const i=S.mc.findIndex(x=>x.id===M.eid);if(i>=0)S.mc[i]=rec}else S.mc.push(rec);

/* ---------- ngôn ngữ ---------- */
let LANG=lget('qlct_lang')==='en'?'en':'vi';
let ENX=null;
const isL=c=>c&&/[A-Za-z0-9À-ỹ]/.test(c);
function TR(t){
  if(LANG!=='en'||!t)return t;
  if(!ENX){const m=new Map(EN_PAIRS);ENX={m,re:new RegExp([...m.keys()].sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g')}}
  return t.replace(ENX.re,(k,off,str)=>{if(isL(k[0])&&isL(str[off-1]))return k;if(isL(k[k.length-1])&&isL(str[off+k.length]))return k;return ENX.m.get(k)})
}
function trTree(root){
  if(LANG!=='en'||!root)return;
  if(root.nodeType===3){const v=TR(root.nodeValue);if(v!==root.nodeValue)root.nodeValue=v;return}
  if(root.nodeType!==1||/^(SCRIPT|STYLE)$/.test(root.tagName))return;
  [root,...root.querySelectorAll('[placeholder],[aria-label],[title]')].forEach(e=>['placeholder','aria-label','title'].forEach(a=>{const v=e.getAttribute(a);if(v){const t=TR(v);if(t!==v)e.setAttribute(a,t)}}));
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L2=[];let n;while(n=w.nextNode())L2.push(n);
  L2.forEach(n=>{const v=TR(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v});
}
new MutationObserver(ms=>{if(LANG!=='en')return;ms.forEach(m=>{m.addedNodes.forEach(trTree);if(m.type==='characterData')trTree(m.target)})}).observe(document.body,{childList:true,subtree:true,characterData:true});
function langBtn(){return `<button class="lg-pill" onclick="toggleLang()"><span class="${LANG==='en'?'on':''}">ENG</span> | <span class="${LANG==='vi'?'on':''}">VIE</span></button>`}
function drawFt(){const f=$('#ft');if(f)f.innerHTML='Quản lý chi tiêu · Phiên bản 1.16.0<br>Tác giả: <b>AnhQuang</b>';document.title=TR('Quản lý chi tiêu')}
function toggleLang(){
  LANG=LANG==='en'?'vi':'en';lset('qlct_lang',LANG);document.documentElement.lang=LANG==='en'?'en':'vi';
  ['#ov','#ovp'].forEach(q=>{const o=$(q);if(o)o.remove()});
  if($('#splash'))drawSplash();render();if($('#ovt'))drawTheme();
}

let SP={q:null,c:null,t:null};
function showSplash(){
  SP.q=QUOTES[Math.floor(Math.random()*QUOTES.length)];SP.c=COINS[Math.floor(Math.random()*COINS.length)];
  const s=document.createElement('div');s.id='splash';document.body.appendChild(s);drawSplash();
  s.onclick=e=>{if(!e.target.closest('.lg-pill'))hideSplash()};
  SP.t=setTimeout(hideSplash,5000);
}

const ghCfg=()=>{try{const c=JSON.parse(lget('qlct_gh')||'null');return c&&c.repo&&c.token?c:null}catch(e){return null}};
const slugOf=n=>{const t=noAcc(n).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');if(t)return t;let h=0;for(const ch of String(n))h=(h*31+ch.charCodeAt(0))>>>0;return 'u'+h.toString(36)};
const b64e=t=>{const b=new TextEncoder().encode(t);let r='';b.forEach(x=>{r+=String.fromCharCode(x)});return btoa(r)};
const b64d=t=>new TextDecoder().decode(Uint8Array.from(atob(t.replace(/\s/g,'')),c=>c.charCodeAt(0)));

async function ghf(path,opt={}){
  const c=ghCfg();if(!c)throw new Error('nocfg');
  let r;try{r=await fetch('https://api.github.com'+path,{...opt,headers:{Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}})}catch(e){throw new Error('net')}
  if(r.status===401)throw new Error('auth');
  if(r.status===403||r.status===429)throw new Error('forbidden');
  return r;
}
async function ghGet(path){
  const c=ghCfg(),r=await ghf('/repos/'+c.repo+'/contents/'+path+'?ref='+encodeURIComponent(c.branch)+'&_='+Date.now());
  if(r.status===404)return null;
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json();let text='';
  if(j.content)text=b64d(j.content);else if(j.download_url)text=await(await fetch(j.download_url)).text();
  return{sha:j.sha,text};
}
async function ghPut(path,text,sha,msg){
  const c=ghCfg(),body={message:msg,content:b64e(text),branch:c.branch};if(sha)body.sha=sha;
  const r=await ghf('/repos/'+c.repo+'/contents/'+path,{method:'PUT',body:JSON.stringify(body)});
  if(r.status===409||r.status===422)throw new Error('conflict');
  if(r.status===404)throw new Error('norepo');
  if(!r.ok)throw new Error('HTTP '+r.status);
  return(await r.json()).content.sha;
}
async function ghUsers(){const r=await ghGet('data/_users.json');try{return r?JSON.parse(r.text).users||{}:{}}catch(e){return{}}}
async function ghClaim(name){
  const sl=slugOf(name);
  for(let i=0;i<3;i++){
    const r=await ghGet('data/_users.json');let o={users:{}};try{if(r)o=JSON.parse(r.text)}catch(e){}
    o.users=o.users||{};if(o.users[sl])return 'exists';
    o.users[sl]={name,created:Date.now()};
    try{await ghPut('data/_users.json',JSON.stringify(o,null,1),r&&r.sha,'Thêm người dùng '+name);return 'ok'}catch(e){if(e.message!=='conflict')throw e}
  }
  throw new Error('conflict');
}
const ghErr=m=>m==='net'?'Không kết nối được. Hãy kiểm tra mạng':m==='auth'?'Token không đúng hoặc đã hết hạn':m==='forbidden'?'GitHub từ chối: token thiếu quyền Contents (Read and write), hoặc đã quá giới hạn':m==='norepo'?'Không tìm thấy kho, hoặc token không có quyền ghi vào kho':m==='conflict'?'Dữ liệu đang được cập nhật ở nơi khác, hãy thử lại':m==='nocfg'?'Chưa kết nối GitHub':'Lỗi: '+m;
function snap(){
  const b={};GKEYS.forEach(k=>{b[k]={};(S[k]||[]).forEach(x=>{b[k][x.id]=JSON.stringify(x)})});
  ['in','out'].forEach(t=>{b['n'+t]={};S.notes[t].forEach(x=>{b['n'+t][x.name.toLowerCase()]=JSON.stringify(x)})});return b;
}
function merge3(L,R,B,kf){
  const lm=new Map(L.map(x=>[String(kf(x)),x])),rm=new Map(R.map(x=>[String(kf(x)),x])),keys=new Set([...lm.keys(),...rm.keys(),...Object.keys(B)]),out=[];
  keys.forEach(k=>{
    const l=lm.get(k),r=rm.get(k),b=B[k],ls=l&&JSON.stringify(l),rs=r&&JSON.stringify(r);
    if(l&&r)out.push(ls===rs?l:(b&&ls===b?r:l));
    else if(l){if(!(b&&ls===b))out.push(l)}
    else if(r){if(!(b&&rs===b))out.push(r)}
  });
  return out;
}
function gMerge(R){
  let B={};try{B=JSON.parse(lget('qlct_gb_'+U)||'{}')}catch(e){}
  GKEYS.forEach(k=>{S[k]=merge3(S[k]||[],R[k]||[],B[k]||{},x=>x.id)});
  ['in','out'].forEach(t=>{S.notes[t]=merge3(S.notes[t]||[],(R.notes&&R.notes[t])||[],B['n'+t]||{},x=>x.name.toLowerCase())});
  const ids=new Set(S.tx.map(x=>String(x.id)));S.trash=S.trash.filter(x=>!ids.has(String(x.id))&&Date.now()-x.del<2592e6);
}
const gPath=()=>'data/'+slugOf(U)+'.json';
const gPayload=()=>JSON.stringify({v:1,name:U,savedAt:Date.now(),tx:S.tx,notes:S.notes,loans:S.loans,mc:S.mc,trash:S.trash},null,1);
async function gSync(inter){
  if(GBUSY||!ghCfg()||!U)return;GBUSY=true;gSt('sync');
  try{
    if(!GCL[U]){await ghClaim(U);GCL[U]=1}
    if(!GSEC[U]){
      AREM=await ghUsers();GADM=2;const ru=AREM[slugOf(U)],lu=users[U];
      if(ru&&ru.ph&&lu&&(!lu.ph||(ru.pt||0)>(lu.pt||0))){Object.assign(lu,{ps:ru.ps,ph:ru.ph,pp:ru.pp,pm:ru.pm,rh:ru.rh,pt:ru.pt});lset('qlct_users',JSON.stringify(users))}
      else if(lu&&lu.ph&&(!ru||!ru.ph||(lu.pt||0)>(ru.pt||0)))await ghSetSec(U);
      GSEC[U]=1;
    }
    let changed=false;
    for(let i=0;i<3;i++){
      const r=await ghGet(gPath());
      if(r&&r.text){const before=JSON.stringify(S);gMerge(JSON.parse(r.text));if(before!==JSON.stringify(S))changed=true}
      lset('qlct_d_'+U,JSON.stringify(S));
      try{await ghPut(gPath(),gPayload(),r&&r.sha,'Cập nhật dữ liệu '+U);break}catch(e){if(e.message!=='conflict'||i===2)throw e}
    }
    lset('qlct_gb_'+U,JSON.stringify(snap()));
    glSet({...glGet(),last:Date.now()});gSt('ok');
    if(inter)toast('Đã đồng bộ ✓');
    if(changed)render();else if(V.tab==='ut'&&V.ut==='gs')render();
  }catch(e){gSt('err');if(inter)toast(ghErr(String(e.message||e)))}
  finally{GBUSY=false}
}
async function gRestore(){
  if(GBUSY||!ghCfg())return;GBUSY=true;gSt('sync');
  try{
    const r=await ghGet(gPath());
    if(!r||!r.text){gSt('idle');toast('Chưa có dữ liệu trên GitHub để khôi phục');return}
    const R=JSON.parse(r.text);S.tx=R.tx||[];S.loans=R.loans||[];S.mc=R.mc||[];S.trash=R.trash||[];
    S.notes=R.notes||{in:[],out:[]};S.notes.in=S.notes.in||[];S.notes.out=S.notes.out||[];
    lset('qlct_d_'+U,JSON.stringify(S));lset('qlct_gb_'+U,JSON.stringify(snap()));
    glSet({...glGet(),last:Date.now()});gSt('ok');toast('Đã khôi phục từ GitHub ✓');render();
  }catch(e){gSt('err');toast(ghErr(String(e.message||e)))}
  finally{GBUSY=false}
}

async function ghConnect(){
  const repo=$('#ghrepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,''),br=$('#ghbr').value.trim()||'main',tok=$('#ghtok').value.trim(),pub=$('#ghpub')&&$('#ghpub').checked;

  if(tok.length<20){toast('Token chưa đúng');return}
  const old=lget('qlct_gh');lset('qlct_gh',JSON.stringify({repo,branch:br,token:tok}));toast('Đang kết nối...');
  try{
    const r=await ghf('/repos/'+repo);if(r.status===404)throw new Error('norepo');if(!r.ok)throw new Error('HTTP '+r.status);
    const info=await r.json();
    if(info.private===false&&!pub){throw new Error('public')}
    if(!(await ghGet('data/README.md')))await ghPut('data/README.md','# Dữ liệu ứng dụng Quản lý chi tiêu\n\nMỗi người dùng có một file .json trong thư mục này. Không chỉnh sửa bằng tay.\n',null,'Tạo thư mục data');
    GCL={};toast('Đã kết nối ✓');
    if(U){gInit();render();gSync(true)}else render();
  }catch(e){
    if(old)lset('qlct_gh',old);else try{localStorage.removeItem('qlct_gh')}catch(x){}
    const m=String(e.message||e);toast(m==='public'?'Kho này công khai: ai cũng đọc được dữ liệu của bạn. Hãy dùng kho riêng tư (Private)':ghErr(m));
  }
}

const PAL=['#4c8bf5','#f5a623','#9b59b6','#1abc9c','#e67e22','#e84393','#7f8c8d'];
function pie(arr,total){
  if(!arr.length||!total)return '';
  const top=arr.slice(0,6),rest=arr.slice(6).reduce((s,x)=>s+x.sum,0);
  if(rest)top.push({name:'Khác',sum:rest});
  let off=25,c='',lg='';
  top.forEach((x,i)=>{const p=x.sum/total*100;c+=`<circle r="15.915" cx="21" cy="21" fill="none" stroke="${PAL[i]}" stroke-width="7" stroke-dasharray="${p} ${100-p}" stroke-dashoffset="${off}"/>`;off-=p;lg+=`<span><i style="background:${PAL[i]}"></i>${esc(x.name)} ${p.toFixed(0)}%</span>`});
  return `<div style="text-align:center"><svg viewBox="0 0 42 42" width="150" height="150">${c}</svg></div><div class="lg">${lg}</div><div style="height:8px"></div>`;
}
function bars(l,M,key){
  const n=M?new Date(+key.slice(0,4),+key.slice(5,7),0).getDate():12,a=Array.from({length:n},()=>({i:0,o:0}));
  l.forEach(t=>{const k=M?+t.date.slice(8,10):+t.date.slice(5,7);a[k-1][t.type==='in'?'i':'o']+=t.amount});
  const mx=Math.max(1,...a.map(x=>Math.max(x.i,x.o))),w=320/n,bw=Math.max(1.5,w*.4);
  let s='',lb='';
  a.forEach((x,k)=>{const hi=x.i/mx*100,ho=x.o/mx*100,x0=10+k*w+w*.1;
    s+=`<rect x="${x0}" y="${110-hi}" width="${bw}" height="${hi}" style="fill:var(--in)"/><rect x="${x0+bw}" y="${110-ho}" width="${bw}" height="${ho}" style="fill:var(--out)"/>`;
    if(!M||k===0||(k+1)%5===0)lb+=`<text x="${x0+bw}" y="124" text-anchor="middle" font-size="8" style="fill:var(--mu)">${k+1}</text>`});
  let cmp='';
  if(M){const d=new Date(+key.slice(0,4),+key.slice(5,7)-2,1),pk=d.getFullYear()+'-'+pad(d.getMonth()+1),po=tot(S.tx.filter(t=>t.date.startsWith(pk))).o,co=tot(l).o;
    if(po)cmp=`<div class="hint" style="margin:6px 0 0">Chi tiêu so với tháng trước: <b class="${co>po?'out':'in'}">${co>=po?'+':''}${((co-po)/po*100).toFixed(0)}%</b> (${fmt(po)})</div>`}
  return `${secO('s_bars','Thu / chi theo '+(M?'ngày':'tháng'),true)}<svg viewBox="0 0 340 130" width="100%"><line x1="10" x2="330" y1="110" y2="110" style="stroke:var(--bd)"/>${s}${lb}</svg><div class="lg"><span><i style="background:var(--in)"></i>Thu</span><span><i style="background:var(--out)"></i>Chi</span></div>${cmp}${secC()}`;
}

const dl=async(name,data)=>{
  try{
    const type=name.endsWith('.xlsx')?'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet':name.endsWith('.png')?'image/png':'application/json';
    const file=new File([data],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});toast('Đã chia sẻ file ✓');return true}
    const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Đã tải file ✓');return true;
  }catch(e){if(!e||e.name!=='AbortError')toast('Không tải được file');return false}
};
const stamp=()=>today.split('-').join('');

async function chgPw(){

  if(!u||u.hash!==await hash(o,u.salt))m='Mật khẩu hiện tại không đúng';

function importFile(e){
  const f=e.target.files[0];if(!f)return;
  const xl=/\.xlsx?$/i.test(f.name),r=new FileReader();
  r.onload=()=>{
    try{
      let tx=[],nt={in:[],out:[]},csv=false;const s=xl?xlsxToCsv(r.result):String(r.result).replace(/^\ufeff/,'');
      if(s.trim()[0]==='{'){const o=JSON.parse(s);tx=o.tx||[];nt=o.notes||nt;['qrs','mc'].forEach(k=>(o[k]||[]).forEach(q=>{if(q&&q.id&&!S[k].some(x=>String(x.id)===String(q.id)))S[k].push(q)}));(o.loans||[]).forEach(q=>{if(q&&q.id&&!S.loans.some(x=>String(x.id)===String(q.id)))S.loans.push(q)})}
      else{csv=true;s.split(/\r?\n/).slice(1).forEach(ln=>{
        const m=ln.match(/^(\d\d)\/(\d\d)\/(\d{4}),([^,]*),("(?:[^"]|"")*"|[^,]*),(\d+)(?:,([^,]*))?\s*$/);
        if(m)tx.push({id:Date.now()+Math.random(),type:m[4].startsWith('Thu')?'in':'out',amount:+m[6],note:m[5].replace(/^"|"$/g,'').replace(/""/g,'"'),date:m[3]+'-'+m[2]+'-'+m[1],ts:0,src:Object.keys(SRC).find(k=>SRC[k]===(m[7]||'').trim())||'cash'})})}
      const key=t=>[t.date,t.type,t.amount,t.note.toLowerCase()].join('|');
      const ids=new Set(S.tx.map(t=>String(t.id))),keys=new Set(S.tx.map(key));let n=0;
      tx.forEach(t=>{
        if(!t||!['in','out'].includes(t.type)||!(t.amount>0)||typeof t.note!=='string'||!/^\d{4}-\d\d-\d\d$/.test(t.date))return;
        if(ids.has(String(t.id))||(csv&&keys.has(key(t))))return;
        S.tx.push({id:t.id||Date.now()+Math.random(),type:t.type,amount:t.amount,note:t.note,date:t.date,ts:t.ts||0,src:SRC[t.src]?t.src:'cash'});n++;
        nt[t.type]=nt[t.type]||[];nt[t.type].push({name:t.note,last:t.ts||0,count:1});
      });
      ['in','out'].forEach(k=>(nt[k]||[]).forEach(x=>{if(x&&x.name&&!S.notes[k].some(y=>y.name.toLowerCase()===x.name.toLowerCase()))S.notes[k].push({name:x.name,last:x.last||0,count:x.count||0,icon:x.icon||'',color:x.color||''})}));
      save();render();toast('Đã nhập '+n+' giao dịch');
    }catch(err){toast('File không hợp lệ')}
  };
  xl?r.readAsArrayBuffer(f):r.readAsText(f);
}
gInit();
render();
showSplash();
if(LANG==='en'){document.documentElement.lang='en';trTree(document.body)}
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))</script>
</body>
</html>
